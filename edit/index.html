const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const KEY = 'energetika-key-v1:' + location.pathname;
async function keyFromPw(pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name: 'PBKDF2', salt: b64(P.salt), iterations: P.it, hash: 'SHA-256'}, base, {name: 'AES-GCM', length: 256}, true, ['decrypt']);
}
async function open(key) {
  const buf = await crypto.subtle.decrypt({name: 'AES-GCM', iv: b64(P.iv)}, key, b64(P.ct));
  let html = await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  const MK = '<' + '!--EN-ONLINE-->';
  if (html.indexOf(MK) >= 0) {   // готовый дашборд для скачивания: без пароля, без ссылок на редактор
    const offline = html.replace(/<!--EN-ONLINE-->[\s\S]*?<!--\/EN-ONLINE-->/g, '');
    const url = URL.createObjectURL(new Blob([offline], {type: 'text/html;charset=utf-8'}));
    html = html.replace('<head>', '<head><script>window.__EN_DL=' + JSON.stringify(url) + '<\/script>');
  }
  document.open(); document.write(html); document.close();
}
(async () => {
  try {
    const saved = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (saved && saved.salt === P.salt && saved.until > Date.now()) {
      const key = await crypto.subtle.importKey('jwk', saved.jwk, {name: 'AES-GCM'}, true, ['decrypt']);
      await open(key); return;
    }
  } catch (e) { try { localStorage.removeItem(KEY); } catch (_) {} }
})();
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = document.getElementById('err'), btn = document.getElementById('go');
  err.textContent = ''; btn.textContent = 'Проверяю…';
  try {
    const key = await keyFromPw(document.getElementById('pw').value);
    if (document.getElementById('rm').checked) {
      try { localStorage.setItem(KEY, JSON.stringify({salt: P.salt, until: Date.now() + 30 * 864e5, jwk: await crypto.subtle.exportKey('jwk', key)})); } catch (_) {}
    }
    await open(key);
  } catch (x) {
    try { localStorage.removeItem(KEY); } catch (_) {}
    err.textContent = 'Неверный пароль'; btn.textContent = 'Открыть';
  }
});
