name: Публикация сайта

# Запускается при каждом обновлении страницы (её присылает сборка из energetika-data).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Подготовка файлов сайта
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude 'README.md' ./ _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      # GitHub иногда не находит только что загруженный артефакт — пробуем ещё два раза с паузой.
      - id: try1
        continue-on-error: true
        uses: actions/deploy-pages@v5
      - if: steps.try1.outcome == 'failure'
        run: sleep 45
      - id: try2
        if: steps.try1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v5
      - if: steps.try1.outcome == 'failure' && steps.try2.outcome == 'failure'
        run: sleep 90
      - id: try3
        if: steps.try1.outcome == 'failure' && steps.try2.outcome == 'failure'
        uses: actions/deploy-pages@v5
      - id: deployment
        run: echo "page_url=${{ steps.try1.outputs.page_url || steps.try2.outputs.page_url || steps.try3.outputs.page_url }}" >> "$GITHUB_OUTPUT"
